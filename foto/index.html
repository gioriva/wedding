<style>
  :root { --white:#F5F0E8; --green:#A8C89A; --green-dark:#5C7A4E; --green-deep:#2C4A1E; --ink:#2C3B28; --ink-light:#4a5e3a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--white); color:var(--ink);
    font-family:'Montserrat',sans-serif; font-weight:300;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:40px 24px; text-align:center;
    background-image:
      radial-gradient(ellipse 55% 50% at 12% 90%, rgba(168,200,154,.22) 0%, transparent 65%),
      radial-gradient(ellipse 45% 40% at 90% 10%, rgba(168,200,154,.16) 0%, transparent 60%);
  }
  .box { max-width:440px; }
  .mono { font-family:'Cormorant Garamond',serif; font-size:1.6rem; font-weight:300; letter-spacing:.08em; color:var(--ink); margin-bottom:36px; }
  .mono span { color:var(--green-deep); }
  .spinner { width:34px; height:34px; margin:0 auto 26px; border:1px solid rgba(92,122,78,.25); border-top-color:var(--green-deep); border-radius:50%; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { font-family:'Cormorant Garamond',serif; font-size:2rem; font-weight:300; font-style:italic; color:var(--green-deep); margin-bottom:14px; line-height:1.2; }
  p { font-size:.84rem; line-height:1.8; color:var(--ink-light); margin-bottom:28px; }
  a.btn {
    display:inline-flex; align-items:center; gap:11px;
    font-size:.66rem; font-weight:500; letter-spacing:.2em; text-transform:uppercase;
    background:var(--ink); color:var(--white); text-decoration:none;
    padding:16px 34px; border-radius:2px; transition:background .3s, transform .2s;
  }
  a.btn:hover { background:var(--green-deep); transform:translateY(-2px); }
  a.home { display:inline-block; margin-top:26px; font-size:.6rem; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-light); text-decoration:none; border-bottom:1px solid rgba(74,94,58,.3); padding-bottom:3px; }
  a.home:hover { color:var(--green-deep); }
  @media (prefers-reduced-motion: reduce) { .spinner { animation:none; } }
</style>
